<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf8f3">
<meta name="robots" content="noindex, nofollow">
<title>تسجيل دخول المسؤول | آية اليوم</title>

<link rel="icon" type="image/png" href="https://i.postimg.cc/2SvchTqS/verse-of-the-day.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/2SvchTqS/verse-of-the-day.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/public/css/login.css">

</head>
<body>

<main class="auth-page">

  <div class="auth-card" role="region" aria-label="تسجيل دخول المسؤول">

    <div class="auth-brand">
      <img src="https://i.postimg.cc/2SvchTqS/verse-of-the-day.png" alt="آية اليوم" width="64" height="64">
    </div>

    <header class="auth-head">
      <h1 class="auth-title">تسجيل دخول المسؤول</h1>
      <p class="auth-sub">هذه الصفحة مخصصة لمسؤولي الموقع فقط.</p>
    </header>

    <form class="auth-form" id="loginForm" novalidate>

      <div class="field">
        <label for="username">اسم المستخدم</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          spellcheck="false"
          required
          aria-required="true"
        >
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="field-password">
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
            aria-required="true"
          >
          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
            aria-label="إظهار كلمة المرور"
            aria-pressed="false"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <p class="auth-error" id="authError" role="alert" aria-live="polite"></p>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
        <span class="btn-label">تسجيل الدخول</span>
        <span class="btn-spinner" aria-hidden="true"></span>
      </button>

    </form>

    <footer class="auth-foot">
      <a href="/">العودة إلى الصفحة الرئيسية</a>
    </footer>

  </div>

</main>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="/public/js/login.js" defer></script>
</body>
</html>
